[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-lite"
version = "0.4.0"
description = "Ultra-simple Colab-ready multi-agent primitives for Nexus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wookjin Choi", email = "wookjin.choi@jefferson.edu" }]
keywords = ["agents", "multi-agent", "colab", "pty", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/choilab-jefferson/nexus.lite"
Issues = "https://github.com/choilab-jefferson/nexus.lite/issues"
Changelog = "https://github.com/choilab-jefferson/nexus.lite/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyte>=0.8.1",  # golden-fixture generation and parity checks only (scripts/make_pty_goldens.py); never imported at runtime
    "wcwidth>=0.2",
]
mlflow = [
    "mlflow-skinny>=2.10",
    "sqlalchemy>=1.4",
    "alembic>=1.8",
]
demos = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydicom>=2.4.0",
    "SimpleITK>=2.3.0",
]

[project.scripts]
nexus-lite = "nexus_lite.cli:main"
nexus-lite-colab = "nexus_lite.colab.tunnel:main"
nexus-lite-demo = "nexus_lite.demos.cli:main"

# `nexus_lite_private` exists only in the GitLab repo; the public snapshot has no such directory, so a
# build from it ships `nexus_lite*` alone.
[tool.setuptools.packages.find]
include = ["nexus_lite*", "nexus_lite_private*"]
